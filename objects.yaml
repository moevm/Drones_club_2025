# ============================================
# СЦЕНЫ ДЛЯ _build_default_scene() (простая загрузка URDF)
# ============================================

default:
  - kind: cube_with_dog
    urdf: cube_with_dog.urdf
    position: [1.5, 1.5, 0.5]
    euler_orientation: [0, 0, 0]
    global_scaling: 1

  - kind: cube_with_dog_too
    urdf: cube_with_dog.urdf
    texture: tag.png
    position: [-1.1, 1, 0.5]
    euler_orientation: [0, 0, 0]
    global_scaling: 1

simple_house:
  - kind: simple_house
    urdf: home/home.urdf
    position: [0, 3, 0]
    euler_orientation: [1.57, 0, 0]
    global_scaling: 1

simple_houses:
  - kind: simple_house
    urdf: home/home.urdf
    position: [0, 3, 0]
    euler_orientation: [1.57, 0, 0]
    global_scaling: 0.5

  - kind: simple_house
    urdf: home/home.urdf
    position: [2, 7, 0]
    euler_orientation: [1.57, 0, 0]
    global_scaling: 1

  - kind: simple_house
    urdf: home/home.urdf
    position: [-5, -3, 0]
    euler_orientation: [1.57, 0, 0]
    global_scaling: 2

# ============================================
# СЦЕНЫ ДЛЯ _build_city_scene() и _build_hay_scene()
# ============================================

city_params:
  kind: city
  urdf: beautiful_city/beautiful_city.urdf
  position: [10, 10, 0]
  euler_orientation: [1.57, 0, 0]
  global_scaling: 10

hay_params:
  kind: hay_bales
  urdf: hay_bales/HayBales.urdf
  position: [0, 0, 0]
  euler_orientation: [1.57, 0, 0]
  global_scaling: 0.8
